<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json">
    <title>pwa-ar-objetos3d</title>
  </head>
  <body>
    <h1>Atlas 3D - Progreso</h1>

    <!-- Lista para mostrar los favoritos guardados -->
    <ul id="lista-catalogo"></ul>

    <!-- Elementos adicionales referenciados en app.js -->
    <div id="descripcion"></div>
   <!-- Contenedor del Visor con el video de fondo oculto -->
    <div id="visor" class="visor" style="position: relative; width: 100%; height: 400px; background: #0b1220;">
      <video id="fondo-camara" class="fondo-camara" playsinline muted hidden></video>
      <div id="lienzo-3d" style="width: 100%; height: 100%;"></div>
    </div>

    <!--BOTONES DE SENSORES Y CÁMARA -->
    <div style="margin-top: 10px;">
      <button id="btn-orientacion">📱 Rotar con el teléfono</button>
      <button id="btn-calibrar" disabled>Calibrar</button>
      <button id="btn-camara">📷 Cámara de fondo</button>
    </div>

    <div style="margin-top: 15px;">
      <button id="btn-avisos"> Activar avisos</button>
      <button id="btn-descargar"> Descargar fichas para offline</button>
    </div>
    <div id="estado-descarga" style="margin-top: 6px; font-size: 0.9rem; color: #38bdf8;"></div>
    
    <!-- Contenedor para los mensajes de estado -->
    <div id="mensaje-visor" style="margin-top: 8px; color: #38bdf8; font-size: 0.9rem;"></div>

    <div id="xr-overlay" class="xr-overlay">
      <p id="xr-estado">Sesión de realidad aumentada activa</p>
      <button type="button" id="btn-salir-ar">Salir de AR</button>
    </div>

    <button type="button" id="btn-ar" disabled>Ver en AR</button>
    <p id="estado-ar">Comprobando soporte para realidad aumentada...</p>

    <details class="diag-ar">
      <summary>Diagnóstico de realidad aumentada</summary>
      <pre id="diag-ar"></pre>
      <button type="button" id="btn-recomprobar">Comprobar de nuevo</button>
    </details>

    <!-- Apuntando al script en la raíz si app.js está en la raíz -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
